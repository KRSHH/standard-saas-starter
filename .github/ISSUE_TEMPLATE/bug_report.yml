name: Bug report
description: Something in the template is broken or behaves unexpectedly.
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Clone the template
        2. Run `bun run dev`
        3. Navigate to ...
    validations:
      required: true

  - type: input
    id: area
    attributes:
      label: Affected area
      placeholder: auth / billing / notifications / uploads / build / other

  - type: input
    id: template-version
    attributes:
      label: Template version
      description: Commit you cloned from — run `git rev-parse --short HEAD`.
      placeholder: 4dcbe6e

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Bun/Node version, and any relevant env configuration (never paste secrets).
      placeholder: |
        OS: macOS 15
        Bun: 1.3.0
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Terminal or browser console output. Automatically formatted as code.
      render: shell
